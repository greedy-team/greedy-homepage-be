spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:greedy_homepage;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        type:
          descriptor:
            sql: TRACE
        format_sql: true
        show_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
