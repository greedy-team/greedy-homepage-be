services:
  redis:
    container_name: redis
    image: redis:alpine
    hostname: redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  blue:
    container_name: blue
    image: ghcr.io/greedy-team/greedy-homepage-be:latest
    ports:
      - "8081:8080"
      - "9091:9090"
    volumes:
      - ~/config:/app/config:ro
    depends_on:
      - redis
    restart: unless-stopped

  green:
    container_name: green
    image: ghcr.io/greedy-team/greedy-homepage-be:latest
    ports:
      - "8082:8080"
      - "9092:9090"
    volumes:
      - ~/config:/app/config:ro
    depends_on:
      - redis
    restart: unless-stopped
