name: CI/CD for prod

on:
  push:
    branches: [ prod ]

permissions:
  contents: read
  packages: write

jobs:
  ci:
    runs-on: ubuntu-22.04
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Java 21 설정
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: 테스트
        run: ./gradlew test --no-daemon

      - name: Gradle 빌드
        run: ./gradlew bootJar -x test --no-daemon

      - name: Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: ghcr 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 이미지 빌드 및 푸시
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile-prod
          push: true
          tags: ghcr.io/greedy-team/greedy-homepage-be:latest

      - name: compose 파일 서버 전송
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.PROD_SERVER_IP }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SERVER_KEY }}
          source: "docker-compose-prod.yml"
          target: "~"

  cd:
    needs: ci
    runs-on: ubuntu-22.04
    steps:
      - name: application.yml 생성
        env:
          APP_YML: ${{ secrets.CICD_APPLICATION_PROD }}
        run: |
          mkdir -p ./config
          printf '%s' "$APP_YML" > ./config/application.yml

      - name: application.yml 서버 전송
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.PROD_SERVER_IP }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SERVER_KEY }}
          source: "config/application.yml"
          target: "~"

      - name: 서버에서 배포
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PROD_SERVER_IP }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SERVER_KEY }}
          envs: GHCR_TOKEN,GHCR_ACTOR
          script: |
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin
            cd ~
            ./deploy.sh
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
